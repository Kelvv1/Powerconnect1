<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Power — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#0B3B24;
    --green:#146B3A;
    --green-light:#E9F5EC;
    --gold:#F2B705;
    --ink:#132018;
    --muted:#5B6B60;
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--green-light);color:var(--ink);line-height:1.5;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px 5vw;
  }
  h1,.step-title{font-family:'Poppins',system-ui,sans-serif;}
  .step-card{
    width:100%;max-width:380px;
    background:linear-gradient(160deg,var(--green-deep),var(--green));
    border-radius:22px;padding:6px;
    box-shadow:0 12px 30px rgba(11,59,36,0.18);
  }
  .step-title{padding:20px 26px;font-size:1.2rem;font-weight:700;color:#fff;}
  .step-title span{color:var(--gold);}
  .inner{background:#fff;border-radius:18px;padding:30px 26px;}
  .field{margin-bottom:16px;text-align:left;}
  .field label{display:block;font-size:.8rem;font-weight:600;color:var(--green-deep);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;border-radius:9px;border:1.5px solid var(--green);
    font-size:.92rem;font-family:inherit;color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .login-btn{
    width:100%;background:var(--gold);color:var(--green-deep);
    padding:14px;border-radius:10px;border:none;
    font-weight:700;font-size:.95rem;cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .login-btn:hover{background:#ffcc33;transform:translateY(-1px);}
  .error-msg{color:#B3261E;font-size:.85rem;margin-top:12px;text-align:center;min-height:1.2em;}
  .back-home{
    display:block;margin-top:16px;text-align:center;font-size:0.85rem;color:var(--muted);
    text-decoration:none;
  }
  .back-home:hover{color:var(--green-deep);text-decoration:underline;}
</style>
</head>
<body>

<div class="step-card">
  <div class="step-title">Admin <span>Login</span></div>
  <div class="inner">
    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Admin username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Admin password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn">Log in →</button>
      <p id="error-msg" class="error-msg"></p>
    </form>
    <a href="index.html" class="back-home">← Back to Portal Home</a>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');
    errorMsg.textContent = 'Verifying credentials...';
    errorMsg.style.color = '#5B6B60';

    fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          window.location.href = 'admin-dashboard.html';
        } else {
          errorMsg.style.color = '#B3261E';
          errorMsg.textContent = data.message || 'Login failed. Check your username and password.';
        }
      })
      .catch(() => {
        errorMsg.style.color = '#B3261E';
        errorMsg.textContent = 'Could not reach the server.';
      });
  });
</script>

</body>
</html>
