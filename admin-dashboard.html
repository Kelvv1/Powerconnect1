<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Power — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#0B3B24;
    --green:#146B3A;
    --green-light:#E9F5EC;
    --gold:#F2B705;
    --ink:#132018;
    --muted:#5B6B60;
    --line:#DCE7DF;
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--green-light);color:var(--ink);line-height:1.5;padding:28px 4vw 60px;}
  h1{font-family:'Poppins',system-ui,sans-serif;}

  header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:24px;flex-wrap:wrap;gap:12px;
  }
  .header-left{display:flex;align-items:center;gap:12px;}
  .header-left h1{font-size:1.4rem;color:var(--green-deep);}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .nav-btn{
    background:#fff;color:var(--green-deep);border:1.5px solid var(--green-deep);padding:9px 16px;
    border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px;
  }
  .nav-btn:hover{background:var(--green-light);}
  .logout-btn{
    background:var(--green-deep);color:#fff;border:none;padding:10px 18px;
    border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;
    transition:background .15s ease;
  }
  .logout-btn:hover{background:#0e4e2a;}

  .summary{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:20px;font-size:.92rem;color:var(--muted);
    box-shadow:0 2px 8px rgba(11,59,36,0.05);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  .summary b{color:var(--green-deep);}

  .table-wrap{
    overflow-x:auto;background:#fff;border-radius:14px;border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(11,59,36,0.06);
  }
  table{
    width:100%;border-collapse:collapse;font-size:.88rem;
  }
  th, td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;}
  th{background:#F7FBF8;color:var(--green-deep);font-size:.78rem;text-transform:uppercase;letter-spacing:0.04em;font-weight:700;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#F9FDFB;}

  .paid-badge{
    display:inline-flex;align-items:center;gap:4px;
    background:#E3F6EB;color:var(--green-deep);font-weight:600;
    padding:4px 8px;border-radius:6px;font-size:0.8rem;
  }
  .track-pill{
    display:inline-block;padding:3px 8px;border-radius:6px;font-size:0.78rem;font-weight:600;
    background:var(--green-light);color:var(--green-deep);
  }

  .doc-tag{
    display:inline-block;background:#EBF3EE;color:var(--green-deep);font-size:0.75rem;
    padding:3px 8px;border-radius:6px;text-decoration:none;font-weight:600;
    margin:2px 4px 2px 0;transition:all 0.15s ease;white-space:nowrap;
  }
  .doc-tag:hover{background:var(--gold);color:var(--green-deep);}

  .empty-msg{padding:48px 24px;text-align:center;color:var(--muted);background:#fff;border-radius:14px;}
  .empty-icon{font-size:2.5rem;margin-bottom:12px;display:block;}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="10" r="5" fill="#F2B705"/>
      <path d="M24 16C24 16 10 20 10 34C10 34 24 34 24 20C24 34 38 34 38 34C38 20 24 16 24 16Z" fill="#146B3A"/>
    </svg>
    <h1>Connect Power — Applications Dashboard</h1>
  </div>
  <div class="header-actions">
    <a href="index.html" class="nav-btn">Public Portal</a>
    <button class="logout-btn" id="logout-btn">Log out</button>
  </div>
</header>

<div class="summary" id="summary">Loading applications data…</div>
<div class="table-wrap" id="table-wrap"></div>

<script>
  fetch('/api/applications')
    .then(res => {
      if (res.status === 401) { window.location.href = 'admin-login.html'; return; }
      return res.json();
    })
    .then(data => {
      if (!data) return;
      const apps = data.applications || [];
      document.getElementById('summary').innerHTML = `
        <span><b>${apps.length}</b> verified paid application${apps.length === 1 ? '' : 's'} recorded in system.</span>
        <span style="font-size:0.8rem;color:var(--muted);">All records cryptographically verified with Paystack</span>
      `;

      if (apps.length === 0) {
        document.getElementById('table-wrap').innerHTML = `
          <div class="empty-msg">
            <span class="empty-icon">📂</span>
            <h3>No applications submitted yet.</h3>
            <p style="font-size:0.88rem;color:var(--muted);margin-top:6px;">Submitted applications will automatically appear here once payments are completed.</p>
          </div>
        `;
        return;
      }

      const docLabels = {
        birth: 'Birth Cert', nysc: 'NYSC', waec: 'WAEC/NECO',
        photo: 'Passport Photo', govid: 'Gov ID', prof: 'Prof Cert',
        degree: 'Degree / Result', cv: 'CV'
      };

      function docLinks(a) {
        const docs = a.documents || {};
        const keys = Object.keys(docs);
        if (keys.length === 0) return '<span style="color:var(--muted);font-style:italic;">No files</span>';
        return keys.map(key =>
          `<a class="doc-tag" href="/api/uploads/${encodeURIComponent(a.reference)}/${encodeURIComponent(docs[key])}" target="_blank">📄 ${docLabels[key] || key}</a>`
        ).join(' ');
      }

      let rows = apps.map(a => `
        <tr>
          <td><strong>${a.fullname || '—'}</strong></td>
          <td><a href="mailto:${a.email}" style="color:var(--green-deep);text-decoration:underline;">${a.email || '—'}</a></td>
          <td><span class="track-pill">${a.track || '—'}</span></td>
          <td style="font-family:monospace;letter-spacing:0.04em;">${a.nin || '—'}</td>
          <td style="font-family:monospace;font-weight:600;color:var(--green-deep);">${a.reference || '—'}</td>
          <td><span class="paid-badge">✓ Paid ₦${a.amountPaid || 1015}</span></td>
          <td style="font-size:0.82rem;color:var(--muted);">${a.submittedAt ? new Date(a.submittedAt).toLocaleString() : '—'}</td>
          <td>${docLinks(a)}</td>
        </tr>
      `).join('');

      document.getElementById('table-wrap').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Track</th><th>NIN</th><th>Reference</th><th>Payment</th><th>Submitted at</th><th>Documents</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    })
    .catch(() => {
      document.getElementById('summary').textContent = 'Could not load applications. Please verify your admin connection.';
    });

  document.getElementById('logout-btn').addEventListener('click', function () {
    fetch('/api/admin-logout', { method: 'POST' }).then(() => {
      window.location.href = 'admin-login.html';
    });
  });
</script>

</body>
</html>
