<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Power — Step 2: Personal Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#0B3B24;
    --green:#146B3A;
    --green-light:#E9F5EC;
    --gold:#F2B705;
    --ink:#132018;
    --muted:#5B6B60;
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--green-light);
    color:var(--ink);line-height:1.5;
    min-height:100vh;
    padding:28px 5vw 60px;
  }
  h1,h2,.step-title{font-family:'Poppins',system-ui,sans-serif;}

  .step-card{
    max-width:760px;margin:0 auto;
    background:linear-gradient(160deg,var(--green-deep),var(--green));
    border-radius:22px;
    padding:6px;
    box-shadow:0 12px 30px rgba(11,59,36,0.18);
  }
  .step-title{
    padding:20px 26px;
    font-size:1.3rem;font-weight:700;color:#fff;
  }
  .step-title span{color:var(--gold);}

  .inner{background:#fff;border-radius:18px;padding:30px 28px;}

  .row{display:grid;gap:16px;margin-bottom:18px;}
  .row-3{grid-template-columns:repeat(3,1fr);}
  .row-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:640px){ .row-3,.row-2{grid-template-columns:1fr;} }

  .field label{
    display:block;font-size:.82rem;font-weight:600;color:var(--green-deep);margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;padding:12px 14px;border-radius:9px;border:1.5px solid var(--green);
    font-size:.92rem;font-family:inherit;color:var(--ink);background:#fff;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--gold);outline-offset:1px;}

  .save-btn{
    width:100%;margin-top:8px;
    background:var(--green-deep);color:#fff;
    padding:15px;border-radius:10px;border:none;
    font-weight:700;font-size:1rem;cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .save-btn:hover{background:#0e4e2a;transform:translateY(-1px);}
  .back-link{
    display:block;margin-top:16px;font-size:.85rem;color:var(--muted);text-decoration:none;text-align:center;
  }
  .back-link:hover{color:var(--green-deep);text-decoration:underline;}
  .error-msg{color:#c0392b;font-size:.82rem;margin:4px 0 0;min-height:1em;}
</style>
</head>
<body>

<div class="step-card">
  <div class="step-title"><span>STEP 2:</span> Personal Details</div>
  <div class="inner">
    <form onsubmit="return handleStep2Submit(event);">

      <div class="row row-3">
        <div class="field">
          <label for="surname">Surname</label>
          <input id="surname" type="text" required>
        </div>
        <div class="field">
          <label for="firstname">First Name</label>
          <input id="firstname" type="text" required>
        </div>
        <div class="field">
          <label for="middlename">Middle Name</label>
          <input id="middlename" type="text">
        </div>
      </div>

      <div class="row row-2">
        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="" disabled selected>Select</option>
            <option>Female</option>
            <option>Male</option>
          </select>
        </div>
        <div class="field">
          <label for="marital">Marital Status</label>
          <select id="marital" required>
            <option value="" disabled selected>Select</option>
            <option>Single</option>
            <option>Married</option>
            <option>Divorced</option>
            <option>Widowed</option>
          </select>
        </div>
      </div>

      <div class="row row-2">
        <div class="field">
          <label for="dob">Date of Birth</label>
          <input id="dob" type="date" required>
        </div>
        <div class="field">
          <label for="phone">Phone Number</label>
          <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="08000000000" required>
          <p id="phone-error" class="error-msg"></p>
        </div>
      </div>

      <div class="row row-2">
        <div class="field">
          <label for="employment">Employment Status</label>
          <select id="employment" required>
            <option value="" disabled selected>Select</option>
            <option>Employed</option>
            <option>Unemployed</option>
            <option>Self-employed</option>
            <option>Student</option>
          </select>
        </div>
        <div class="field">
          <label for="profession">Current Profession</label>
          <select id="profession" required>
            <option value="" disabled selected>Select</option>
            <option>Teacher</option>
            <option>Trader</option>
            <option>Farmer</option>
            <option>Artisan / Skilled Tradesperson</option>
            <option>Civil Servant</option>
            <option>Healthcare Worker</option>
            <option>Engineer</option>
            <option>IT / Tech Professional</option>
            <option>Driver</option>
            <option>Tailor / Fashion Designer</option>
            <option>Hairdresser / Barber</option>
            <option>Business Owner</option>
            <option>Student</option>
            <option>Unemployed</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="disability">Physical Disability Status</label>
          <select id="disability" required>
            <option value="" disabled selected>Select</option>
            <option>None</option>
            <option>Visual impairment</option>
            <option>Hearing impairment</option>
            <option>Mobility impairment</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="row row-2">
        <div class="field">
          <label for="state">State of Origin</label>
          <select id="state" required onchange="populateLgaOptions();">
            <option value="" disabled selected>Select state</option>
          </select>
        </div>
        <div class="field">
          <label for="lga">LGA</label>
          <select id="lga" required disabled>
            <option value="" disabled selected>Select state first</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="address">Residential Address</label>
          <input id="address" type="text" placeholder="Street, city, state" required>
        </div>
      </div>

      <button type="submit" class="save-btn">SAVE &amp; CONTINUE →</button>
    </form>
    <a href="step1.html" class="back-link">← Back to Step 1</a>
  </div>
</div>

  function populateStateOptions() {
    const stateSelect = document.getElementById('state');
    Object.keys(stateLgaData).sort().forEach(function(stateName) {
      const opt = document.createElement('option');
      opt.value = stateName;
      opt.textContent = stateName;
      stateSelect.appendChild(opt);
    });
  }

  function populateLgaOptions() {
    const stateSelect = document.getElementById('state');
    const lgaSelect = document.getElementById('lga');
    const selectedState = stateSelect.value;
    lgaSelect.innerHTML = '';
    if (!selectedState || !stateLgaData[selectedState]) {
      lgaSelect.disabled = true;
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.selected = true;
      placeholder.textContent = 'Select state first';
      lgaSelect.appendChild(placeholder);
      return;
    }
    lgaSelect.disabled = false;
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.disabled = true;
    placeholder.selected = true;
    placeholder.textContent = 'Select LGA';
    lgaSelect.appendChild(placeholder);
    stateLgaData[selectedState].forEach(function(lgaName) {
      const opt = document.createElement('option');
      opt.value = lgaName;
      opt.textContent = lgaName;
      lgaSelect.appendChild(opt);
    });
  }

  populateStateOptions();

  // Pre-fill phone if saved during registration
  const regPhone = localStorage.getItem('cp_reg_phone');
  if (regPhone) {
    document.getElementById('phone').value = regPhone;
  }

  function handleStep2Submit(event) {
    event.preventDefault();
    const phone = document.getElementById('phone').value.trim();
    const errorBox = document.getElementById('phone-error');
    if (!/^\d{11}$/.test(phone)) {
      errorBox.textContent = 'Phone number must be exactly 11 digits.';
      return false;
    }
    errorBox.textContent = '';
    const fullname = document.getElementById('firstname').value.trim() + ' ' + document.getElementById('surname').value.trim();
    localStorage.setItem('cp_fullname', fullname);
    localStorage.setItem('cp_firstname', document.getElementById('firstname').value.trim());
    localStorage.setItem('cp_surname', document.getElementById('surname').value.trim());
    localStorage.setItem('cp_middlename', document.getElementById('middlename').value.trim());
    localStorage.setItem('cp_gender', document.getElementById('gender').value);
    localStorage.setItem('cp_dob', document.getElementById('dob').value);
    localStorage.setItem('cp_phone', phone);
    localStorage.setItem('cp_state', document.getElementById('state').value);
    localStorage.setItem('cp_lga', document.getElementById('lga').value);
    localStorage.setItem('cp_address', document.getElementById('address').value.trim());
    
    window.location.href = 'step3.html';
    return false;
  }
</script>
</body>
</html>
